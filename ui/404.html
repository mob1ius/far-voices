<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Far Voices</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{--void:#04070D;--ice:#93D8EC;--dim:#5A6B78;--rule:#1B2836}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--void);color:var(--ice);
    display:grid;place-items:center;text-align:center;padding:24px;
    font-family:"IBM Plex Mono",monospace}
  .code{font-family:"Barlow Condensed",sans-serif;font-size:clamp(64px,18vw,140px);
    line-height:1;letter-spacing:.02em;margin:0 0 4px}
  .status{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);
    margin-bottom:28px}
  p{color:var(--dim);font-size:13px;line-height:1.7;max-width:38ch;margin:0 auto 28px}
  a{color:var(--ice);text-decoration:none;font-size:12px;letter-spacing:.15em;
    text-transform:uppercase;border:1px solid var(--rule);padding:10px 22px;
    border-radius:2px;transition:border-color .15s,color .15s}
  a:hover{border-color:var(--ice)}
</style>
<div>
  <p class="code">LOS</p>
  <div class="status">Loss of signal</div>
  <p>Nothing is on the air at this address. The pass has ended, or never
  began here.</p>
  <a href="/">Return to the deck</a>
</div>
